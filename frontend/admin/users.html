      <div class="admin-sidebar-footer">

          data-admin-logout

        </button>

    </aside>

    <!-- Main content -->
    <main class="admin-main">

      <div class="admin-topbar">
        <div>
          <p class="eyebrow admin-eyebrow">
            Leads
          </p>

          <h1 class="admin-title">
            Manage Users
          </h1>
        </div>
      </div>

      <div class="admin-card">

        <div class="table-toolbar">
          <div class="table-search">
            <input
              type="text"
              id="userSearch"
              placeholder="Search by name, email or phone…"
              autocomplete="off"
            >
          </div>
        </div>

        <div class="table-scroll">
          <table class="admin-table">

            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Status</th>
                <th>Registered</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="usersBody">
              <tr>
                <td
                  colspan="6"
                  class="cell-muted"
                >
                  Loading…
                </td>

            </tbody>

          </table>

      </div>

    </main>
  </div>

  <script src="../api.js"></script>
  <script src="admin.js"></script>

  <script>
    'use strict';

    var allUsers = [];

    var tbody =
      document.getElementById('usersBody');

    var searchInput =
      document.getElementById('userSearch');

    /* ---------------------------------
       Escape unsafe HTML
    --------------------------------- */

    function escapeHtml(value) {
      var div = document.createElement('div');

      div.textContent =
        value == null ? '' : String(value);

      return div.innerHTML;
    }

    /* ---------------------------------
       Format registration date
    --------------------------------- */

    function formatDate(value) {
      if (!value) {
        return '—';
      }

      var date = new Date(value);

      if (isNaN(date.getTime())) {
        return escapeHtml(value);
      }

      return date.toLocaleDateString(
        'en-IN',
        {
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        }
      );
    }

    /* ---------------------------------
       Get MongoDB user ID
    --------------------------------- */

    function getUserId(user) {
      if (!user) {
        return '';
      }

      return user._id || user.id || '';
    }

    /* ---------------------------------
       Get user active status
    --------------------------------- */

    function getUserStatus(user) {
      return user && user.isActive === true;
    }

    /* ---------------------------------
       Build user row
    --------------------------------- */

    function rowHtml(user) {
      var userId = getUserId(user);

      var isActive = getUserStatus(user);

      var statusText =
        isActive ? 'Active' : 'Inactive';

      var statusClass =
        isActive ? 'active' : 'inactive';

      var safeId =
        escapeHtml(userId);

      var encodedId =
        encodeURIComponent(userId);

      return (
        '<tr data-row-id="' +
        safeId +
        '">' +

          '<td class="cell-primary">' +
            '<a ' +
              'href="user-detail.html?id=' +
              encodedId +
              '" ' +
              'style="color: inherit;"' +
            '>' +
              escapeHtml(user.name || 'Unnamed user') +
            '</a>' +
          '</td>' +

          '<td class="cell-muted">' +
            escapeHtml(user.email || '—') +
          '</td>' +

          '<td class="cell-muted">' +
            escapeHtml(user.phone || '—') +
          '</td>' +

          '<td>' +
            '<button ' +
              'type="button" ' +
              'class="status-badge is-' +
              statusClass +
              '" ' +
              'data-toggle-status="' +
              safeId +
              '" ' +
              'data-current-active="' +
              String(isActive) +
              '"' +
            '>' +
              statusText +
            '</button>' +
          '</td>' +

          '<td class="cell-muted">' +
            formatDate(user.createdAt) +
          '</td>' +

          '<td class="cell-actions">' +

            '<a ' +
              'class="table-action" ' +
              'href="user-detail.html?id=' +
              encodedId +
              '"' +
            '>' +
              'View' +
            '</a>' +

            '<button ' +
              'type="button" ' +
              'class="table-action is-danger" ' +
              'data-delete-user="' +
              safeId +
              '"' +
            '>' +
              'Delete' +
            '</button>' +

          '</td>' +

        '</tr>'
      );
    }

    /* ---------------------------------
       Render user list
    --------------------------------- */

    function render(users) {
      if (!Array.isArray(users)) {
        console.error(
          'render expected an array:',
          users
        );

        tbody.innerHTML =
          '<tr>' +
            '<td colspan="6">' +
              '<div class="empty-state">' +
                '<p class="empty-state-title">' +
                  'Invalid users response' +
                '</p>' +
                '<p>' +
                  'The server did not return a valid users list.' +
                '</p>' +
              '</div>' +
            '</td>' +
          '</tr>';

        return;
      }

      if (users.length === 0) {
        tbody.innerHTML =
          '<tr>' +
            '<td colspan="6">' +
              '<div class="empty-state">' +
                '<p class="empty-state-title">' +
                  'No users found' +
                '</p>' +
                '<p>' +
                  'Registrations will appear here as they come in.' +
                '</p>' +
              '</div>' +
            '</td>' +
          '</tr>';

        return;
      }

      tbody.innerHTML =
        users.map(rowHtml).join('');
    }

    /* ---------------------------------
       Load users from backend
    --------------------------------- */

    async function loadUsers() {
      tbody.innerHTML =
        '<tr>' +
          '<td colspan="6" class="cell-muted">' +
            'Loading users…' +
          '</td>' +
        '</tr>';

      try {
        var response =
          await window.KiAspireAPI.getAdminUsers();

        console.log(
          'getAdminUsers response:',
          response
        );

        /*
          Supports both API styles:

          1. getAdminUsers() returns array directly
          2. getAdminUsers() returns:
             { success, count, users }
        */

        var users;

        if (Array.isArray(response)) {
          users = response;
        } else if (
          response &&
          Array.isArray(response.users)
        ) {
          users = response.users;
        } else if (
          response &&
          Array.isArray(response.data)
        ) {
          users = response.data;
        } else {
          users = [];
        }

        allUsers = users;

        render(allUsers);
      } catch (error) {
        console.error(
          'getAdminUsers failed:',
          error
        );

        var message =
          error && error.message
            ? error.message
            : 'Please refresh the page.';

        tbody.innerHTML =
          '<tr>' +
            '<td colspan="6">' +
              '<div class="empty-state">' +
                '<p class="empty-state-title">' +
                  'Couldn\'t load users' +
                '</p>' +
                '<p>' +
                  escapeHtml(message) +
                '</p>' +
              '</div>' +
            '</td>' +
          '</tr>';
      }
    }

    /* ---------------------------------
       Search users
    --------------------------------- */

    searchInput.addEventListener(
      'input',
      function (event) {
        var query =
          event.target.value
            .trim()
            .toLowerCase();

        if (!query) {
          render(allUsers);
          return;
        }

        var filteredUsers =
          allUsers.filter(function (user) {
            var name =
              String(user.name || '')
                .toLowerCase();

            var email =
              String(user.email || '')
                .toLowerCase();

            var phone =
              String(user.phone || '')
                .toLowerCase();

            return (
              name.indexOf(query) > -1 ||
              email.indexOf(query) > -1 ||
              phone.indexOf(query) > -1
            );
          });

        render(filteredUsers);
      }
    );

    /* ---------------------------------
       Status and delete actions
    --------------------------------- */

    tbody.addEventListener(
      'click',
      async function (event) {

        /*
          Activate/deactivate user
        */

        var toggleButton =
          event.target.closest(
            '[data-toggle-status]'
          );

        if (toggleButton) {
          var userId =
            toggleButton.getAttribute(
              'data-toggle-status'
            );

          var currentActive =
            toggleButton.getAttribute(
              'data-current-active'
            ) === 'true';

          var nextActive =
            !currentActive;

          var nextStatusText =
            nextActive ? 'active' : 'inactive';

          if (!userId) {
            console.error(
              'Status update failed: missing user ID'
            );

            alert(
              'User ID is missing. Refresh the page and try again.'
            );

            return;
          }

          var confirmed =
            confirm(
              'Mark this user as ' +
              nextStatusText +
              '?'
            );

          if (!confirmed) {
            return;
          }

          toggleButton.disabled = true;

          try {
            await window.KiAspireAPI
              .setAdminUserStatus(
                userId,
                nextActive
              );

            await loadUsers();
          } catch (error) {
            console.error(
              'setAdminUserStatus failed:',
              error
            );

            alert(
              error && error.message
                ? error.message
                : 'Could not update status. Please try again.'
            );

            toggleButton.disabled = false;
          }

          return;
        }

        /*
          Delete user
        */

        var deleteButton =
          event.target.closest(
            '[data-delete-user]'
          );

        if (deleteButton) {
          var deleteUserId =
            deleteButton.getAttribute(
              'data-delete-user'
            );

          if (!deleteUserId) {
            console.error(
              'Delete failed: missing user ID'
            );

            alert(
              'User ID is missing. Refresh the page and try again.'
            );

            return;
          }

          var deleteConfirmed =
            confirm(
              'Delete this user permanently? This action cannot be undone.'
            );

          if (!deleteConfirmed) {
            return;
          }

          deleteButton.disabled = true;

          try {
            await window.KiAspireAPI
              .deleteAdminUser(
                deleteUserId
              );

            allUsers =
              allUsers.filter(
                function (user) {
                  return (
                    getUserId(user) !==
                    deleteUserId
                  );
                }
              );

            render(allUsers);
          } catch (error) {
            console.error(
              'deleteAdminUser failed:',
              error
            );

            alert(
              error && error.message
                ? error.message
                : 'Could not delete this user. Please try again.'
            );

            deleteButton.disabled = false;
          }
        }
      }
    );

    /* ---------------------------------
       Initial load
    --------------------------------- */

    loadUsers();
  </script>

</body>
</html>
