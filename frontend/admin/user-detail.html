<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Detail — Ki Aspire Abroad Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body class="admin-body">

<div class="admin-mobile-bar">
  <img src="../Logo.webp" alt="Ki Aspire Abroad">
  <button class="admin-mobile-toggle" id="adminMobileToggle" aria-label="Open menu">☰</button>
</div>
<div class="admin-sidebar-scrim" id="adminSidebarScrim"></div>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="admin-sidebar-logo"><img src="../Logo.webp" alt="Ki Aspire Abroad" style="width:100%; height:auto;"></div>
    <p class="admin-sidebar-tag">Admin Panel</p>
    <nav class="admin-nav">
      <a href="dashboard.html"><span class="admin-nav-icon">◆</span> Dashboard</a>
      <a href="users.html" class="is-active"><span class="admin-nav-icon">◆</span> Manage Users</a>
      <a href="services.html"><span class="admin-nav-icon">◆</span> Manage Services</a>
      <a href="stories.html"><span class="admin-nav-icon">◆</span> Manage Stories</a>
      <a href="profile.html"><span class="admin-nav-icon">◆</span> My Profile</a>
    </nav>
    <div class="admin-sidebar-footer">
      <div class="admin-sidebar-admin"><strong id="sidebarAdminName">Admin</strong>Signed in</div>
      <button class="admin-logout-btn" type="button" data-admin-logout>Log Out</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <p class="eyebrow admin-eyebrow">Leads</p>
        <h1 class="admin-title">User Detail</h1>
      </div>
      
    </div>

    
    <div class="admin-card admin-card-pad" id="userDetailCard">
      <p class="cell-muted">Loading…</p>
    </div>

  </main>
</div>



<script src="../api.js"></script>
<script src="admin.js"></script>
<script>

  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }
  function formatDate(iso){
    if(!iso) return '—';
    var d = new Date(iso);
    if(isNaN(d.getTime())) return String(iso);
    return d.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
  }

  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var card = document.getElementById('userDetailCard');
  var heading = document.querySelector('.admin-title');

  function render(u){
    var userId = u._id || u.id;
    var isActive = u.isActive === true;

    heading.textContent = u.name || 'User Detail';
    card.innerHTML =
      '<div class="detail-grid">' +
        '<div class="detail-field"><strong>Full Name</strong><span>' + escapeHtml(u.name) + '</span></div>' +
        '<div class="detail-field"><strong>Status</strong><span><span class="status-badge is-' + (isActive ? 'active' : 'inactive') + '">' + (isActive ? 'Active' : 'Inactive') + '</span></span></div>' +
        '<div class="detail-field"><strong>Email</strong><span>' + escapeHtml(u.email) + '</span></div>' +
        '<div class="detail-field"><strong>Phone</strong><span>' + escapeHtml(u.phone) + '</span></div>' +
        '<div class="detail-field"><strong>Registered</strong><span>' + formatDate(u.createdAt) + '</span></div>' +
        '<div class="detail-field"><strong>User ID</strong><span>' + escapeHtml(userId) + '</span></div>' +
      '</div>' +
      '<div class="admin-topbar-actions" style="margin-top:28px;">' +
        '<button type="button" class="btn btn-outline" id="toggleStatusBtn">Mark as ' + (isActive ? 'Inactive' : 'Active') + '</button>' +
        '<button type="button" class="btn btn-outline" id="deleteUserBtn" style="border-color:#A6432B; color:#A6432B;">Delete User</button>' +
        '<a href="users.html" class="btn btn-dark">Back to All Users</a>' +
      '</div>';

    document.getElementById('toggleStatusBtn').addEventListener('click', function(){
      var nextActive = !isActive;
      if(!confirm('Mark this user as ' + (nextActive ? 'active' : 'inactive') + '?')) return;
      window.KiAspireAPI.setAdminUserStatus(userId, nextActive)
        .then(function(){ window.location.reload(); })
        .catch(function(err){ console.error(err); alert('Could not update status.'); });
    });
    document.getElementById('deleteUserBtn').addEventListener('click', function(){
      if(!confirm('Delete this user permanently? This cannot be undone.')) return;
      window.KiAspireAPI.deleteAdminUser(userId)
        .then(function(){ window.location.href = 'users.html'; })
        .catch(function(err){ console.error(err); alert('Could not delete this user.'); });
    });
  }

  if(!id){
    card.innerHTML = '<p class="cell-muted">No user specified. <a href="users.html" style="color:var(--brass-deep); font-weight:600;">Back to Manage Users</a></p>';
  } else {
    window.KiAspireAPI.getAdminUser(id)
      .then(render)
      .catch(function(err){
        console.error('getAdminUser failed:', err);
        card.innerHTML = '<p class="cell-muted">Couldn\'t load this user. <a href="users.html" style="color:var(--brass-deep); font-weight:600;">Back to Manage Users</a></p>';
      });
  }

</script>
</body>
</html>
